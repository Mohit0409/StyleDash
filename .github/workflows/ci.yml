name: Vibe4You CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # GitHub cron is UTC. Daily at 12:05 PM IST; actual start can be delayed.
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: styledash-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -p "test_*.py"
      - run: python -m unittest discover -s qa -p "test_*.py"

  playwright-desktop:
    name: Playwright desktop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:desktop
      - name: Archive browser report on schedule or failure
        if: always() && (github.event_name == 'schedule' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: playwright-desktop-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  playwright-mobile:
    name: Playwright mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mobile
      - name: Archive browser report on schedule or failure
        if: always() && (github.event_name == 'schedule' || failure())
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  live-readonly:
    name: Daily public-site health
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public routes and built-in GA4 without writes
        run: python qa/ci_public_health.py
      - name: Audit published customer price against MRP (public GET only)
        run: python qa/ci_public_catalogue.py
      - name: Upload read-only health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-health-report
          path: |
            qa-results/ci-public-health.json
            qa-results/ci-public-catalogue.json
          retention-days: 14
          if-no-files-found: warn

  required:
    name: StyleDash Required CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend
      - backend
      - playwright-desktop
      - playwright-mobile
    steps:
      - name: Require every CI job
        shell: bash
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.playwright-desktop.result }}" = "success"
          test "${{ needs.playwright-mobile.result }}" = "success"
