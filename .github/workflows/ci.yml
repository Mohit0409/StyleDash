name: Vibe4You CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: styledash-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s server/tests -p "test_*.py"

  playwright-desktop:
    name: Playwright desktop
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:desktop

  playwright-mobile:
    name: Playwright mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:mobile

  required:
    name: StyleDash Required CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend
      - backend
      - playwright-desktop
      - playwright-mobile
    steps:
      - name: Require every CI job
        shell: bash
        run: |
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.playwright-desktop.result }}" = "success"
          test "${{ needs.playwright-mobile.result }}" = "success"
